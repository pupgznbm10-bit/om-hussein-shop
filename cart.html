<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>السلة | أم حسين</title>
    <meta
      name="description"
      content="سلة المشتريات الخاصة بمتجر أم حسين للمنتجات الطازجة والمجمدة."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="cart">
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand" aria-label="أم حسين">
          <span class="brand-mark">أم</span>
          <span>حسين</span>
        </div>
        <nav class="main-nav" aria-label="التنقل الرئيسي">
          <a href="index.html">الرئيسية</a>
          <a href="shop.html">المتجر</a>
          <a href="index.html#about">من نحن</a>
          <a href="index.html#contact">تواصل معنا</a>
        </nav>
        <div class="nav-actions">
          <a class="cart-link has-items" href="cart.html" aria-label="السلة">
            <span class="cart-icon">🛒</span>
            <span class="cart-count">0</span>
          </a>
          <a class="cta-button" href="shop.html">تسوق الآن</a>
        </div>
      </div>
    </header>

    <main class="section">
      <div class="container cart-shell">
        <div class="cart-header">
          <div>
            <p class="eyebrow">السلة</p>
            <h1>منتجاتك المختارة</h1>
          </div>
        </div>

        <div id="cartItems" class="cart-items"></div>

        <div id="cartEmpty" class="empty-cart hidden">
          <h3>السلة فارغة حاليًا</h3>
          <p>ابدأ باختيار بعض الخضار الطازج والمجمد من متجر أم حسين.</p>
        </div>

        <div class="cart-summary">
          <h3>الإجمالي: <span id="cartTotal">0 جنيه</span></h3>
          <div class="cart-summary-actions">
            <button type="button" id="clearCartButton" class="secondary-btn">مسح الطلب</button>
            <a class="secondary-btn" href="shop.html">اكمل التسوق</a>
            <a class="cart-action" href="checkout.html">أكمل عملية الدفع</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer" id="contact">
      <div class="container footer-wrap">
        <div>
          <div class="brand footer-brand">
            <span class="brand-mark">أم</span>
            <span>حسين</span>
          </div>
          <p>خضار طازج، نضارة يومية، وأسعار تضيف قيمة إلى كل بيت.</p>
        </div>
        <div class="footer-links">
          <a href="index.html">الرئيسية</a>
          <a href="shop.html">المتجر</a>
          <a href="index.html#about">من نحن</a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
